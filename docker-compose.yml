version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d appdb"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - echo

  app:
    build: ./back/
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENV: production
      HTTP_PORT: 8080
      JWT_SECRET: supersecretjwtkey
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: appdb
      DB_SSLMODE: disable
      TIME_ZONE: UTC
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - echo

  front:
    container_name: front
    build:
      context: ./front
      dockerfile: front.dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ./front/.env
    environment:
      - API_INTERNAL_URL=http://app:8080
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    volumes:
      - ./front:/app
    restart: unless-stopped
    networks:
      - echo

  bot:
    build: ./bot
    container_name: bot
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy
    env_file:
      - ./bot/.env
    volumes:
      - ./bot:/app
    restart: unless-stopped
    networks:
      - echo

networks:
  echo:
    driver: bridge