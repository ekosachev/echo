name: Lint (Go / JS/TS / Python)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  golang:
    name: Go linters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.20'

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: v1.59.0

      - name: Run golangci-lint on /back
        run: golangci-lint run ./back/...

  javascript:
    name: JavaScript / TypeScript (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install front dependencies
        run: |
          cd front
          npm ci

      - name: Run ESLint on front
        run: |
          cd front
          npx eslint . --ext .js,.jsx,.ts,.tsx

  python:
    name: Python (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install ruff and requirements
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          if [ -f bot/requirements.txt ]; then pip install -r bot/requirements.txt; fi

      - name: Run ruff on `bot`
        run: ruff check bot
